[project]
name = "voice-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
  "sounddevice==0.4.6",
  "soundfile==0.12.1",
  "librosa==0.9.1",
  "ctransformers==0.2.27",
  "pyyaml==6.0.1",
  "ollama>=0.5.2",
  "fastapi==0.111.0",
  "uvicorn==0.29.0",
  "mecab-python3>=1.0.8",
  "unidic>=1.1.0",
  "google-generativeai>=0.8.5",
  "numpy>=1.26.4",
  # PyTorch + torchaudio (plain wheels, no +cpu suffix)
  "torch==2.7.0",
  "torchaudio==2.7.0",
  # KittenTTS release wheel
  "kittentts @ https://github.com/KittenML/KittenTTS/releases/download/0.1/kittentts-0.1.0-py3-none-any.whl",
  # MeloTTS (git source configured below)
  "melotts",
]

[tool.uv.sources]
melotts = { git = "https://github.com/myshell-ai/MeloTTS.git" }
[tool.uv.scripts]
unidic = "python -m unidic download"
